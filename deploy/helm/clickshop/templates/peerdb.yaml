{{- if eq .Values.cdc.mode "peerdb" }}
{{- $tag := .Values.images.peerdbTag }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamicconfig
  labels: {{- include "cs.labels" . | nindent 4 }}
data:
  development-sql.yaml: |
    limit.maxIDLength:
      - value: 255
        constraints: {}
    system.forceSearchAttributesCacheRefreshOnRead:
      - value: true
        constraints: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cs.selector" "temporal" | nindent 4 }}
  ports:
    - { name: grpc, port: 7233, targetPort: 7233 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "cs.selector" "temporal" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cs.selector" "temporal" | nindent 8 }}
    spec:
      initContainers:
        {{- include "cs.waitFor" (dict "root" . "name" "postgres" "host" "postgres" "port" 5432) | nindent 8 }}
      containers:
        - name: temporal
          image: {{ .Values.images.temporal }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PWD
              {{- include "cs.secretRef" (dict "root" . "key" "postgres-password") | nindent 14 }}
            - { name: POSTGRES_SEEDS, value: postgres }
            - { name: DYNAMIC_CONFIG_FILE_PATH, value: config/dynamicconfig/development-sql.yaml }
            - { name: BIND_ON_IP, value: 0.0.0.0 }
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          ports:
            - { containerPort: 7233, name: grpc }
          readinessProbe:
            tcpSocket: { port: 7233 }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.temporal | nindent 12 }}
          volumeMounts:
            - { name: dynamicconfig, mountPath: /etc/temporal/config/dynamicconfig }
      volumes:
        - name: dynamicconfig
          configMap: { name: temporal-dynamicconfig }
{{- range $name := list "flow-api" "flow-worker" "flow-snapshot-worker" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "cs.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "cs.selector" $name | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cs.selector" $name | nindent 8 }}
    spec:
      {{- with $.Values.cdc.staging.serviceAccount }}
      serviceAccountName: {{ . }}
      {{- end }}
      initContainers:
        {{- include "cs.waitFor" (dict "root" $ "name" "temporal" "host" "temporal" "port" 7233) | nindent 8 }}
        {{- if eq $name "flow-api" }}
        - name: flow-migrate
          image: ghcr.io/peerdb-io/flow-api:{{ $tag }}
          command: ["/home/peerdb/peer-flow", "migrate"]
          env: {{- include "cs.peerdbEnv" $ | nindent 12 }}
        {{- end }}
      containers:
        - name: {{ $name }}
          image: ghcr.io/peerdb-io/{{ $name }}:{{ $tag }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          env: {{- include "cs.peerdbEnv" $ | nindent 12 }}
          {{- if eq $name "flow-api" }}
          ports:
            - { containerPort: 8112, name: grpc }
            - { containerPort: 8113, name: http }
          {{- end }}
          resources:
            requests: {{- toYaml $.Values.resources.peerdb.requests | nindent 14 }}
            limits:
              memory: {{ if eq $name "flow-api" }}{{ $.Values.resources.peerdb.limits.memory }}{{ else }}2Gi{{ end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: flow-api
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cs.selector" "flow-api" | nindent 4 }}
  ports:
    - { name: grpc, port: 8112, targetPort: 8112 }
    - { name: http, port: 8113, targetPort: 8113 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peerdb-server
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "cs.selector" "peerdb-server" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cs.selector" "peerdb-server" | nindent 8 }}
    spec:
      {{- with .Values.cdc.staging.serviceAccount }}
      serviceAccountName: {{ . }}
      {{- end }}
      initContainers:
        {{- include "cs.waitFor" (dict "root" . "name" "flow-api" "host" "flow-api" "port" 8112) | nindent 8 }}
      containers:
        - name: peerdb-server
          image: ghcr.io/peerdb-io/peerdb-server:{{ $tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "cs.peerdbEnv" . | nindent 12 }}
            - name: PEERDB_PASSWORD
              {{- include "cs.secretRef" (dict "root" . "key" "demo-password") | nindent 14 }}
            - { name: PEERDB_FLOW_SERVER_ADDRESS, value: "grpc://flow-api:8112" }
            - { name: PEERDB_MIGRATIONS_DISABLED, value: "true" }
            - { name: RUST_LOG, value: info }
          ports:
            - { containerPort: 9900, name: pg }
          resources: {{- toYaml .Values.resources.peerdb | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: peerdb-server
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cs.selector" "peerdb-server" | nindent 4 }}
  ports:
    - { name: pg, port: 9900, targetPort: 9900 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peerdb-ui
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "cs.selector" "peerdb-ui" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cs.selector" "peerdb-ui" | nindent 8 }}
    spec:
      containers:
        - name: peerdb-ui
          image: ghcr.io/peerdb-io/peerdb-ui:{{ $tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "cs.peerdbEnv" . | nindent 12 }}
            - { name: PEERDB_FLOW_SERVER_HTTP, value: "http://flow-api:8113" }
            - name: PEERDB_PASSWORD
              {{- include "cs.secretRef" (dict "root" . "key" "demo-password") | nindent 14 }}
            - name: NEXTAUTH_SECRET
              {{- include "cs.secretRef" (dict "root" . "key" "auth-secret") | nindent 14 }}
            - name: NEXTAUTH_URL
              value: {{ include "cs.publicUrl" (dict "root" . "name" "peerdb" "port" .Values.gateway.ports.peerdb) | default "http://localhost:3000" | quote }}
          ports:
            - { containerPort: 3000, name: http }
          resources: {{- toYaml .Values.resources.peerdb | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: peerdb-ui
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cs.selector" "peerdb-ui" | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
{{- end }}

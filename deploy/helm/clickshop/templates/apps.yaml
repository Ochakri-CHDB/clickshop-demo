{{- $appUrl := include "cs.publicUrl" (dict "root" . "name" "app" "port" .Values.gateway.ports.app) }}
{{- $lfUrl := "" }}
{{- if eq .Values.langfuse.mode "oss" }}{{ $lfUrl = include "cs.publicUrl" (dict "root" . "name" "langfuse" "port" .Values.gateway.ports.langfuse) }}{{ else if eq .Values.langfuse.mode "cloud" }}{{ $lfUrl = .Values.langfuse.baseUrl }}{{ end }}
{{- $hdxUrl := "" }}
{{- if eq .Values.clickstack.mode "oss" }}{{ $hdxUrl = include "cs.publicUrl" (dict "root" . "name" "hyperdx" "port" .Values.gateway.ports.hyperdx) }}{{ else if eq .Values.clickstack.mode "cloud" }}{{ $hdxUrl = .Values.clickstack.uiUrl }}{{ end }}
{{- $cdcUrl := "" }}
{{- if eq .Values.cdc.mode "peerdb" }}{{ $cdcUrl = include "cs.publicUrl" (dict "root" . "name" "peerdb" "port" .Values.gateway.ports.peerdb) }}{{ else if eq .Values.cdc.mode "clickpipes" }}{{ $cdcUrl = .Values.cdc.clickpipesUrl }}{{ end }}
{{- $secureCookies := ternary "true" "false" (and .Values.ingress.enabled (gt (len .Values.ingress.tls) 0)) }}
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cs.selector" "web" | nindent 4 }}
  ports:
    - { name: http, port: 4242, targetPort: 4242 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "cs.selector" "web" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cs.selector" "web" | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ include "cs.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "cs.appEnv" . | nindent 12 }}
            - name: AUTH_SECRET
              {{- include "cs.secretRef" (dict "root" . "key" "auth-secret") | nindent 14 }}
            - name: INTERNAL_API_TOKEN
              {{- include "cs.secretRef" (dict "root" . "key" "internal-token") | nindent 14 }}
            - name: CRON_SECRET
              {{- include "cs.secretRef" (dict "root" . "key" "internal-token") | nindent 14 }}
            - { name: AUTH_TRUST_HOST, value: "true" }
            - { name: ALLOWED_EMAIL_DOMAIN, value: {{ .Values.auth.allowedEmailDomain | quote }} }
            - { name: LIBRECHAT_INTERNAL_URL, value: "http://librechat:3080" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
            - { name: OTEL_COLLECTOR_INTERNAL_URL, value: "http://otel-collector:4318" }
            - { name: DEPLOYMENT_ENVIRONMENT, value: {{ .Values.langfuse.environment | quote }} }
            - { name: APP_PUBLIC_URL, value: {{ $appUrl | default "http://clickshop.local" | quote }} }
            - { name: LINK_LANGFUSE, value: {{ $lfUrl | quote }} }
            - { name: LINK_CLICKSTACK, value: {{ $hdxUrl | quote }} }
            - { name: LINK_CDC, value: {{ $cdcUrl | quote }} }
            - { name: LINK_CLICKHOUSE_CONSOLE, value: {{ .Values.clickhouse.consoleUrl | quote }} }
            - { name: LINK_POSTGRES_CONSOLE, value: {{ .Values.postgres.consoleUrl | quote }} }
          ports:
            - { containerPort: 4242, name: http }
          readinessProbe:
            httpGet: { path: /api/public-config, port: 4242 }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: librechat
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cs.selector" "librechat" | nindent 4 }}
  ports:
    - { name: http, port: 3080, targetPort: 3080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "cs.selector" "librechat" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cs.selector" "librechat" | nindent 8 }}
    spec:
      initContainers:
        {{- include "cs.waitFor" (dict "root" . "name" "mongodb" "host" "mongodb" "port" 27017) | nindent 8 }}
      containers:
        - name: librechat
          image: {{ include "cs.image" (dict "root" . "name" "librechat") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "cs.appEnv" . | nindent 12 }}
            - { name: HOST, value: 0.0.0.0 }
            - { name: PORT, value: "3080" }
            - { name: MONGO_URI, value: "mongodb://mongodb:27017/LibreChat" }
            - { name: DOMAIN_CLIENT, value: {{ $appUrl | default "http://localhost:3080" | quote }} }
            - { name: DOMAIN_SERVER, value: {{ $appUrl | default "http://localhost:3080" | quote }} }
            - { name: SESSION_COOKIE_SECURE, value: {{ $secureCookies | quote }} }
            - { name: TRUST_PROXY, value: "1" }
            - { name: SEARCH, value: "false" }
            - { name: NO_INDEX, value: "true" }
            - { name: ALLOW_EMAIL_LOGIN, value: "true" }
            - { name: ALLOW_REGISTRATION, value: "false" }
            - { name: ALLOW_SOCIAL_LOGIN, value: "false" }
            - { name: CONFIG_PATH, value: /app/librechat.yaml }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
            - name: CREDS_KEY
              {{- include "cs.secretRef" (dict "root" . "key" "librechat-creds-key") | nindent 14 }}
            - name: CREDS_IV
              {{- include "cs.secretRef" (dict "root" . "key" "librechat-creds-iv") | nindent 14 }}
            - name: JWT_SECRET
              {{- include "cs.secretRef" (dict "root" . "key" "librechat-jwt-secret") | nindent 14 }}
            - name: JWT_REFRESH_SECRET
              {{- include "cs.secretRef" (dict "root" . "key" "librechat-jwt-refresh-secret") | nindent 14 }}
          ports:
            - { containerPort: 3080, name: http }
          readinessProbe:
            httpGet: { path: /health, port: 3080 }
            periodSeconds: 10
            failureThreshold: 30
          resources: {{- toYaml .Values.resources.librechat | nindent 12 }}
{{- if eq (include "cs.ollamaEnabled" .) "true" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  labels: {{- include "cs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "cs.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cs.selector" "ollama" | nindent 4 }}
  ports:
    - { name: http, port: 11434, targetPort: 11434 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels: {{- include "cs.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "cs.selector" "ollama" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cs.selector" "ollama" | nindent 8 }}
    spec:
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: pull-model
          image: {{ .Values.images.ollama }}
          command: ["sh", "-c", "ollama serve & sleep 5; ollama pull {{ .Values.ollama.model }}; kill %1 2>/dev/null || true"]
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      containers:
        - name: ollama
          image: {{ .Values.images.ollama }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_CONTEXT_LENGTH, value: {{ .Values.ollama.contextLength | quote }} }
            - { name: OLLAMA_NUM_PARALLEL, value: "1" }
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "1" }
            - { name: OLLAMA_KEEP_ALIVE, value: "-1" }
          lifecycle:
            postStart:
              exec:
                # Load the model in memory so the first chat does not pay the load time.
                command: ["sh", "-c", "sleep 5; ollama run {{ .Values.ollama.model }} '' >/dev/null 2>&1 || true"]
          ports:
            - { containerPort: 11434, name: http }
          readinessProbe:
            httpGet: { path: /api/tags, port: 11434 }
            periodSeconds: 10
          resources: {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
{{- end }}
